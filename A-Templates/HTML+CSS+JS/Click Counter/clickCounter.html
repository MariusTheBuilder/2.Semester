<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Counter</title>
  <link rel="stylesheet" href="clickCounter.css" />
</head>
<body>
  <div class="container">
    <h1>Counter</h1>
    <p id="display">0</p>
    <div class="buttons">
      <button onclick="change(-1)">−</button>
      <button onclick="reset()">Reset</button>
      <button onclick="change(1)">+</button>
    </div>
  </div>
  <script src="clickCounter.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Notes</title>
  <link rel="stylesheet" href="localStorageNotes.css" />
</head>
<body>
  <div class="container">
    <h1>My Notes</h1>
    <textarea id="noteInput" placeholder="Write a note..."></textarea>
    <div class="buttons">
      <button onclick="saveNote()">Save</button>
      <button onclick="clearNote()">Clear</button>
    </div>
    <p id="status"></p>
  </div>
  <script src="localStorageNotes.js"></script>
</body>
</html>

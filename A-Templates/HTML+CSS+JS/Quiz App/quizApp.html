<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Quiz</title>
  <link rel="stylesheet" href="quizApp.css" />
</head>
<body>
  <div class="container">
    <div id="quiz">
      <p id="progress"></p>
      <h2 id="question"></h2>
      <div id="options"></div>
      <p id="feedback"></p>
      <button id="nextBtn" onclick="nextQuestion()" style="display:none">Next</button>
    </div>
    <div id="result" style="display:none">
      <h2>Quiz Complete!</h2>
      <p id="finalScore"></p>
      <button onclick="restart()">Play Again</button>
    </div>
  </div>
  <script src="quizApp.js"></script>
</body>
</html>

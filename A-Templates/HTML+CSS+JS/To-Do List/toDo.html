<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>My To-Do List</title>
  <link rel="stylesheet" href="toDo.css" />
</head>
<body>
  <div class="container">
    <h1>My To-Do List</h1>
    <p class="quote">Some inspirational quote...</p>

    <div class="input-row">
      <input type="text" id="taskInput" placeholder="Enter a new task..." />
      <button onclick="addTask()">Add Task</button>
    </div>

    <ul id="taskList"></ul>
  </div>

  <script src="toDo.js"></script>
</body>
</html>
